name: Build and publish timestamped release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v20261031-111014
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests and build executable JAR
        run: mvn --batch-mode verify

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          built_asset=$(find target -maxdepth 1 -name '*-jar-with-dependencies.jar' -print -quit)
          test -n "$built_asset"
          asset="apsu-game-${RELEASE_TAG}-jar-with-dependencies.jar"
          cp "$built_asset" "$asset"
          source_archive="apsu-game-${RELEASE_TAG}-source.zip"
          git archive --format=zip --prefix="apsu-game-${RELEASE_TAG}/" "$RELEASE_TAG" \
            src/main/java src/test/java tools/assets tools/audio tools/setup pom.xml Makefile > "$source_archive"
          jar_hash=$(sha256sum "$asset" | awk '{print $1}')
          source_hash=$(sha512sum "$source_archive" | awk '{print $1}')
          printf '%s  %s\n' "$jar_hash" "$asset" > "$asset.sha256"
          printf '%s  %s\n' "$source_hash" "$source_archive" > "$source_archive.sha512"
          cat > release-notes.md <<EOF
          # As Águas de Apsu

          Atravesse cinco regiões submersas inspiradas na mitologia suméria. Como Adapa, recupere as tabuletas antigas, desperte o poder das bolhas e enfrente Kullullû nas profundezas do Templo de Apsu.

          Baixe o JAR executável e jogue com Java 21.

          ## Integridade dos arquivos

          - Executável SHA-256: \`$jar_hash\`
          - Pacote de código-fonte SHA-512: \`$source_hash\`
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq 'apsu-game-1.0.0-jar-with-dependencies.jar'; then
              gh release delete-asset "$RELEASE_TAG" 'apsu-game-1.0.0-jar-with-dependencies.jar' --yes
            fi
            gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" "$source_archive" "$source_archive.sha512" --clobber
            gh release edit "$RELEASE_TAG" --title "As Águas de Apsu $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "$asset" "$asset.sha256" "$source_archive" "$source_archive.sha512" --verify-tag --title "As Águas de Apsu $RELEASE_TAG" --notes-file release-notes.md
          fi
